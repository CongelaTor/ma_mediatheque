<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Films - Médiathèque</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%F0%9F%8E%AC%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="app">
        <header class="topbar">
            <a class="brand" href="index.html">
                <div class="brand-icon"><span>🎬</span></div>
                <div class="brand-title">Médiathèque</div>
            </a>
            <nav class="main-nav">
                <a class="nav-button" data-page="home" href="index.html">Accueil</a>
                <a class="nav-button" data-page="collections" href="collections.html">Collections</a>
                <a class="nav-button" data-page="films" href="films.html"
                    onclick="
                        sessionStorage.removeItem('selectedCollectionId');
                        sessionStorage.removeItem('selectedCollectionName');
                    ">Films</a>
                <a class="nav-button" data-page="series" href="series.html">Séries</a>
            </nav>
            <div class="top-actions">
                <input id="searchInput" 
                    class="search-input" 
                    type="search" 
                    placeholder="Filtrer..."
                    oninput="handleSearch()">

                <button
                    class="icon-button refresh-button"
                    onclick="reloadCatalog('films')">
                    <span class="refresh-icon">↻</span>
                    <span>Scan des films</span>
                </button>

                <button
                    class="icon-button refresh-button hidden"
                    onclick="showDetectionPopup()">
                    <span>Détection</span>
                </button>
            </div>
        </header>
        <main>
            <section id="page-films" class="page active">
                <div class="layout">
                    <aside class="sidebar">
                        <div class="sidebar-title">Statistiques</div>
                            <div class="sidebar-stat"><span id="sideFilms">0</span> Films</div>
                            <div class="sidebar-stat"><span id="sideSeries">0</span> Séries</div>
                            <div class="sidebar-stat"><span id="sideEpisodes">0</span> Épisodes</div>
                        <div class="sidebar-section"></div>

                        <div class="sidebar-title">Ajouts</div>
                            <button class="sidebar-link active" data-ajouts="all" 
                                onclick="selectAjouts('all')">Tous les films</button>
                            <button class="sidebar-link" data-ajouts="Nouveautés" 
                                onclick="selectAjouts('Nouveautés')">Nouveautés</button>
                            <button class="sidebar-link" data-ajouts="Récents"
                                onclick="selectAjouts('Récents')">Récents</button>
                            <button class="sidebar-link" data-ajouts="Doublons"
                                onclick="selectAjouts('Doublons')">Doublons</button>
                        <div class="sidebar-section"></div>

                        <div class="sidebar-title">Genre</div>
                            <button class="sidebar-link active" data-genre="all" 
                                onclick="selectGenre('all')">Tous les films</button>
                            <button class="sidebar-link" data-genre="Action" 
                                onclick="selectGenre('Action')">Action</button>
                            <button class="sidebar-link" data-genre="Aventure"
                                onclick="selectGenre('Aventure')">Aventure</button>
                            <button class="sidebar-link" data-genre="Comédie"
                                onclick="selectGenre('Comédie')">Comédie</button>
                            <button class="sidebar-link" data-genre="Comédie musicale"
                                onclick="selectGenre('Comédie musicale')">Comédie musicale</button>
                            <button class="sidebar-link" data-genre="Science-Fiction"
                                onclick="selectGenre('Science-Fiction')">Science-Fiction</button>
                            <button class="sidebar-link" data-genre="Drame" 
                                onclick="selectGenre('Drame')">Drame</button>
                            <button class="sidebar-link" data-genre="Fantastique"
                                onclick="selectGenre('Fantastique')">Fantastique</button>
                            <button class="sidebar-link" data-genre="Thriller"
                                onclick="selectGenre('Thriller')">Thriller</button>
                            <button class="sidebar-link" data-genre="Documentaire"
                                onclick="selectGenre('Documentaire')">Documentaire</button>
                            <button class="sidebar-link" data-genre="Animation"
                                onclick="selectGenre('Animation')">Animation</button>
                            <button class="sidebar-link" data-genre="Animation"
                                onclick="selectGenre('Animation')">Anime</button>
                    </aside>
                    
                    <section class="content">
                        <div class="content-header">
                            <div>
                                <h1>Films</h1>
                                <p id="filmsCount">0 film</p>
                            </div>

                            <button
                                id="backToCollectionsButton"
                                class="secondary-button hidden">
                                ← Retour aux collections
                            </button>
                        </div>
                        <button id="resumeFilmButton" 
                                class="resume-button hidden" 
                                onclick="resumeFilm()">
                            ▶ Reprendre :
                            <span id="resumeFilmText"></span>
                        </button>

                                                <div id="languageFilters" class="language-filters">
                            <button class="language-button active" data-language="VO">VO</button>
                            <button class="language-button active" data-language="VF">VF</button>
                            <button class="language-button active" data-language="VOST">VOST</button>
                            <button class="language-button active" data-language="VOSTFR">VOSTFR</button>
                            <button class="language-button active" data-language="TBD">TBD</button>
                        </div>

                        <div id="filmsGrid" class="cards-grid"></div>
                    </section>
                </div>
            </section>
        </main>
    </div>
    <div id="tmdbModal" class="tmdb-modal hidden">
        <div class="tmdb-modal-panel">
            <div class="tmdb-modal-header">
                <h2 id="tmdbModalTitle">Résultats TMDB</h2>
                <button class="tmdb-modal-close" onclick="closeTmdbModal()">×</button>
            </div>

            <div class="tmdb-search-zone">
                <input
                    id="tmdbSearchInput"
                    class="tmdb-search-input"
                    type="text"
                    placeholder="Recherche TMDB">
            </div>

            <div id="tmdbSearchTokens" class="tmdb-search-tokens"></div>

            <div id="tmdbResults" class="tmdb-results"></div>
        </div>
    </div>

    <div id="scanModal" class="tmdb-modal hidden">
        <div class="tmdb-modal-panel">
            <div class="tmdb-modal-header">
                <h2 id="scanTitle">Scan des films</h2>
            </div>

            <div id="scanLog" class="tmdb-results"></div>

            <div id="detectionLog" class="tmdb-results hidden"></div>

            <div style="padding:16px;text-align:right">
                <button class="secondary-button" onclick="closeScanModal()">
                    Fermer
                </button>
            </div>
        </div>
    </div>

    <script src="js/state.js"></script>
    <script src="js/catalog.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/media.js"></script>
    <script src="js/playback.js"></script>
    <script src="js/tmdb.js"></script>
    <script src="js/films.js"></script>
    <script src="js/collections.js"></script>
    <script src="js/app-init.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", initFilmsPage);
    </script>
</body>

</html>
