<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Médiathèque</title>
    <link rel="icon"
        href="data:image/svg+xml,
          <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🎬</text></svg>">
    <link rel=" stylesheet" href="css/style.css">
</head>

<body>

    <div class="app">
        <header class="topbar">
            <div class="brand brand-logo">
                <div class="brand-icon">
                    <span>🎬</span>
                </div>
                <span class="brand-title">Médiathèque</span>
            </div>
            <nav class="main-nav">
                <a class="nav-button active" data-page="home" href="index.html">Accueil</a>
                <a class="nav-button" data-page="collections" href="collections.html">Collections</a>
                <a class="nav-button" data-page="films" href="films.html">Films</a>
                <a class="nav-button" data-page="series" href="series.html">Séries</a>
            </nav>
            <div class="top-actions">
                <button class="icon-button refresh-button linux-hidden mediaserver-only" 
                        onclick="reloadCatalog('all')">
                    <span class="refresh-icon">↻</span>
                    <span>Scan des disques</span>
                </button>
            </div>
        </header>

        <main>
            <section id="page-home" class="page active">
                <div class="home-header">
                    <div>
                        <h1>Bienvenue dans votre médiathèque</h1>
                        <p>Accédez à toute votre collection de films, séries, BD, livres, musiques et jeux.</p>
                    </div>
                </div>

                <div class="home-cards">
                    <article class="home-card home-card-films" onclick="window.location.href='films.html'">
                        <div class="home-card-image film-hero"></div>
                        <div class="home-card-icon">🎬</div>
                        <h2>Films</h2>
                        <p><span id="homeFilmsStats"></span></p>
                        <button type="button">Accéder aux films ›</button>
                        <button id="resumeFilmButton" class="resume-button hidden" 
                                onclick="event.stopPropagation(); resumeFilm()">
                            ▶&nbsp;&nbsp;&nbsp;<span id="resumeFilmText"></span>
                        </button>
                    </article>

                    <article class="home-card home-card-series" onclick="window.location.href='series.html'">
                        <div class="home-card-image serie-hero"></div>
                        <div class="home-card-icon purple">📺</div>
                        <h2>Séries</h2>
                        <p><span id="homeSeriesStats"></span></p>
                        <button type="button" class="purple-button">Accéder aux séries ›</button>
                        <button id="resumeSerieButton" class="resume-button hidden"
                                onclick="event.stopPropagation(); resumeSerie()">
                            ▶&nbsp;&nbsp;&nbsp;<span id="resumeSerieText"></span>
                        </button>
                    </article>
                </div>
            </section>
        </main>
    </div>

    <div id="tmdbModal" class="tmdb-modal hidden">
        <div class="tmdb-modal-panel">
            <div class="tmdb-modal-header">
                <h2 id="tmdbModalTitle">Résultats TMDB</h2>
                <button class="tmdb-modal-close" onclick="closeTmdbModal()">×</button>
            </div>
            <div id="tmdbResults" class="tmdb-results"></div>
        </div>
    </div>

    <div id="scanModal" class="tmdb-modal hidden">
        <div class="tmdb-modal-panel">
            <div class="tmdb-modal-header">
                <h2 id="scanTitle">Scan des disques</h2>
            </div>

            <div id="scanLog" class="tmdb-results"></div>

            <div style="padding:16px;text-align:right">
                <button class="secondary-button" onclick="closeScanModal()">
                    Fermer
                </button>
            </div>
        </div>
    </div>

    <script src="config/constants.js"></script>
    <script src="js/calculContext.js"></script>
    <script src="js/state.js"></script>
    <script src="js/catalog.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/playback.js"></script>
    <script src="js/collections.js"></script>
    <script src="js/app-init.js"></script>

    <script>
        if (navigator.userAgent.toLowerCase().includes("linux")) {
            document.body.classList.add("linux");
        }
        document.addEventListener('DOMContentLoaded', initHomePage);
    </script>
</body>

</html>
